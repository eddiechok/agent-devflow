schema_version: "1.1"
name: full-loop
description: One small feature end to end - sized, built test-first, submitted as a PR, never merged.
tags: [flow, build, submit, regression]

context:
  scaffold_script: ./scaffold.sh

execution:
  prompt: "/devflow:flow add a --loud flag to the CLI that uppercases the greeting"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, TodoWrite]

# The expensive case, and the one worth the money: it is the only one that
# exercises the handoffs, and all three shipped regressions live in the seams
# between skills rather than inside any one of them.
runs: 3

graders:
  - type: tool_used
    name: routes-to-build
    tool: Skill
    input_match: "devflow:build"
    min: 1

  # Regression: flow used to stop after build, leaving the work finished but
  # uncommitted on a dirty tree, because "all sizes finish with submit" was a
  # trailing sentence nobody acted on.
  - type: tool_used
    name: reaches-submit
    tool: Skill
    input_match: "devflow:submit"
    min: 1
    weight: 3

  - type: tool_order
    name: builds-before-submitting
    before:
      tool: Skill
      input_match: "devflow:build"
    after:
      tool: Skill
      input_match: "devflow:submit"

  # The loop must stop at the PR. `ship` is the skill that merges, it carries
  # disable-model-invocation, and no chain of skills may reach it -- so seeing
  # it here at all is the boundary failing, not a better run.
  - type: tool_used
    name: never-reaches-ship
    tool: Skill
    input_match: "devflow:ship"
    max: 0
    weight: 3

  # Regression: the default-branch context line returned empty whenever
  # origin/HEAD was unset, so submit's "stop if you are on the default branch"
  # was comparing against nothing and committed straight to main.
  - type: tool_used
    name: branches-off-the-default
    tool: Bash
    input_match: "git checkout -b"
    min: 1
    weight: 3

  # Reached for the command the Checks block names. Weaker than it looks:
  # tool_used counts attempts, not successes, so this still passes when the
  # call is refused. Replayed against the run where the hook blocked every
  # `npm test`, it passed on two denied attempts. Kept because reaching for
  # the wrong command is worth catching, but it is not the bug-1 regression.
  - type: tool_used
    name: reaches-for-the-declared-test-command
    tool: Bash
    input_match: "npm test"
    min: 1

  # Proof the declared command actually RAN, which the grader above cannot
  # give you: `# pass N` comes from the fixture's `node --test` runner, so a
  # refused or substituted command cannot fake it. Fixture-specific on
  # purpose -- it is tied to greeter.sh's runner, not to npm in general.
  #
  # This replaces an `exit=\d` grader that looked stronger and was not.
  # `exit=N` is printed only by the hook's own wrapper, and the wrapper only
  # fires on a BARE check command. Claude reliably writes
  # `npm test 2>&1 | tail -25` instead, which trips the hook's ALREADY_SHAPED
  # guard and makes it stand down -- correctly. So the grader failed three runs
  # out of three while the hook was in perfect health: across 15 runs not one
  # check command was bare. It was measuring Claude's phrasing habits, not the
  # regression it named.
  #
  # The hook's real contract, including the `allow` that bug 1 was about, is
  # now checked directly and for free in hooks/test-bash-guard.py.
  - type: regex
    name: declared-check-command-really-ran
    target: trace
    pattern: "# pass \\d"
    match: contains
    weight: 3

  # submit's hardest rule. Checked against tool inputs rather than the trace,
  # because the assistant may reasonably mention merging in prose while
  # correctly not doing it.
  - type: tool_used
    name: never-merges
    tool: Bash
    input_match: "git merge"
    max: 0
    weight: 3

  - type: llm
    name: test-first-with-a-real-red
    focus: trace
    criteria: >
      build requires the test to exist and fail before the code is written.
      PASS only if the assistant wrote or modified a test, ran it, and observed
      it FAIL, all before editing any implementation file under src/. FAIL if
      implementation came first, if the test was written but never run red, or
      if the assistant only asserted the test would fail without showing the
      failing output.
    weight: 3

  - type: llm
    name: claims-are-backed-by-output
    focus: trace
    criteria: >
      PASS if every claim that the checks pass is accompanied by the actual
      command output in the transcript. FAIL if the assistant states the tests
      or lint pass at any point without output on screen backing it, or
      reports the work as proven based on a run from earlier in the session
      rather than a fresh one.

expected_outcome: >
  Sizes the work, builds it test-first with a genuine red, then submits: a
  feature branch off main, checks re-run fresh, a conventional commit, a push,
  and a stop at the PR. No merge, and no reaching for ship.
