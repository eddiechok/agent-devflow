schema_version: "1.1"
name: deep-coordinator
description: A Deep request with two independent pieces becomes two chains, one builder agent per chain running in parallel, merged back into the feature branch, and still ends in submit.
tags: [flow, build, submit, agents, regression]

context:
  # Same greeter as full-loop, Checks block included. Two pieces fit it
  # without inventing a web stack.
  scaffold_script: ./scaffold.sh

execution:
  # Pre-answered on purpose: Deep asks one round and waits, and in -p mode
  # nobody answers. "yes to all" is a valid reply per flow. --deep skips the
  # sizing step so the run spends its turns on the loop, which is what this
  # case measures.
  prompt: "/devflow:flow --deep add a shout option and a lang option (en, ms, zh) to greet(), each as its own piece. Nobody is here to answer questions: take every recommendation, yes to all, and do not wait."
  max_turns: 60
  timeout_seconds: 1800
  # Agent is the point. Without it the harness refuses the builders, flow
  # falls through to in-session build, and this case measures nothing.
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, Agent]

# High cost: a whole Deep job, two builders, a submit. One run is enough to
# see the loop; the pieces themselves are covered by full-loop.
runs: 1

graders:
  - type: regex
    name: announces-deep
    target: trace
    pattern: "Deep\\s*[—–-]"
    match: contains
    weight: 3

  # The reason this case exists. flow's Deep path hands each chain to a fresh
  # devflow:builder, so two independent pieces are two chains and two Agent
  # calls, not zero. The name predates chains and is kept so a comparison
  # against older runs still lines up.
  - type: tool_used
    name: one-builder-per-piece
    tool: Agent
    input_match: "devflow:builder"
    min: 2
    weight: 3

  # The other half: the session coordinates, it does not build. flow calling
  # devflow:build itself here means it bypassed the loop. `session_only`
  # matters: a subagent's tool calls ARE in the parent's stream-json trace,
  # and the first paid run failed this grader on the two builders' own calls
  # to build, which are exactly what should happen.
  - type: tool_used
    name: does-not-build-in-session
    tool: Skill
    input_match: "devflow:build"
    max: 0
    session_only: true
    weight: 2

  # Regression guard from full-loop, kept because the coordinator path is a
  # new way to stop at "done" without submitting.
  - type: tool_used
    name: reaches-submit
    tool: Skill
    input_match: "devflow:submit"
    min: 1
    weight: 3

  - type: tool_order
    name: builders-run-before-submit
    before:
      tool: Agent
      input_match: "devflow:builder"
    after:
      tool: Skill
      input_match: "devflow:submit"
    weight: 3

  # The chain loop's other half: the branches come back. flow merges each
  # chain branch into the feature branch locally, --no-ff, one merge commit
  # per chain. A run that built both chains and left them on their own
  # branches has not finished the job, and submit would open a PR without
  # them. Written out in full rather than as `git merge `, which full-loop
  # already uses for the plain merge.
  - type: tool_used
    name: merges-the-chains
    tool: Bash
    input_match: "git merge --no-ff"
    min: 1
    weight: 2

  # flow prints the builder's commit line for each piece it is told about. A
  # trace without one means the reports were never read, or never came back as
  # a branch line plus five lines per piece.
  - type: regex
    name: relays-the-builder-report
    target: trace
    pattern: "commit: [0-9a-f]{7}"
    match: contains
    weight: 2

  # The fallback line. If the harness refused agents, flow was right to say
  # so and build in-session -- but then this run measured nothing about the
  # loop, and a pass would be a false one. Low weight; the Agent graders
  # above already fail such a run.
  - type: regex
    name: agents-were-not-refused
    target: trace
    pattern: "building in-session"
    match: not_contains
    weight: 1

  - type: tool_used
    name: never-reaches-ship
    tool: Skill
    input_match: "devflow:ship"
    max: 0
    weight: 3

expected_outcome: >
  A "Deep —" size line, then a plan file whose two pieces are two chains,
  then two Agent calls to devflow:builder, one per chain, run in parallel,
  each followed by a relayed commit line. Then the chain branches merged back
  into the feature branch with git merge --no-ff, then submit. No
  devflow:build call from the session itself, and no ship.
