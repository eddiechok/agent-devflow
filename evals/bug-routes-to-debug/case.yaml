schema_version: "1.1"
name: bug-routes-to-debug
description: A bug that only running can show routes through devflow:debug, not devflow:plan, even though "I don't know what's causing it" reads like Deep's own test.
tags: [sizing, flow, debug]

context:
  scaffold_script: ./scaffold.sh

execution:
  # Names the command and the data file, but not the cause. The code is
  # correct and team.txt looks right on screen: the second alice ends in a
  # zero-width space. The request cannot point at the cause, so the route is
  # devflow:debug. The limit, said out loud: a session that reads team.txt
  # receives that character, and one that spots and confirms it while sizing
  # may go to build, which debug-route.md allows -- this case would score that
  # correct run as a fail. bug-routes-to-build is the other half.
  # The last sentence is for #94: Standard waits for go, and nobody answers.
  prompt: "/devflow:flow `node src/cli.js --batch-file team.txt` is supposed to greet each person once, but alice gets greeted twice. team.txt looks fine to me and so does the code. I have no idea what's causing it or where to even look. Nobody is here to answer: take every recommendation, go, and do not wait."
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - type: regex
    name: not-sized-deep
    target: trace
    pattern: "Deep\\s*[—–-]"
    match: not_contains
    weight: 2

  - type: tool_used
    name: routes-to-debug
    tool: Skill
    input_match: "devflow:debug"
    min: 1
    weight: 3

  - type: tool_used
    name: does-not-route-to-plan
    tool: Skill
    input_match: "devflow:plan"
    max: 0
    weight: 3

  - type: llm
    name: names-no-plan
    focus: trace
    criteria: >
      PASS only if the assistant treats "I don't know what's causing it" as a
      reason to look for the cause with a red-capable command, not as a reason
      to write a multi-piece plan. FAIL if it proposes a plan, pieces, or
      chains for this bug, or if it guesses a fix before anything went red.

expected_outcome: >
  Sizes the work Standard, not Deep, and calls devflow:debug rather than
  devflow:plan: neither the report nor a read of the code can name where
  the bug is.
