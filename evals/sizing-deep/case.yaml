schema_version: "1.1"
name: sizing-deep
description: A new subsystem is sized Deep and asks its questions in rounds, each question with a recommendation.
tags: [sizing, flow]

context:
  scaffold_script: ./scaffold.sh

execution:
  # Deliberately a request whose files cannot be named up front -- that is the
  # Deep trigger in flow's own table, not the word "feature".
  prompt: "/devflow:flow add a plugin system so other packages can register their own greeting styles"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Edit, Glob, Grep, Skill]

runs: 3

graders:
  - type: regex
    name: announces-deep
    target: trace
    pattern: "Deep\\s*[—–-]"
    match: contains
    weight: 3

  - type: regex
    name: not-sized-lighter
    target: trace
    pattern: "Quick\\s*[—–-]"
    match: not_contains
    weight: 2

  # Deep asks in popup rounds, or -- where there is no popup tool, which is
  # every `claude -p` run -- in a numbered list. Both shapes are read here: a
  # popup question is an AskUserQuestion input in the trace, a fallback
  # question is a numbered line with a "?" on it. The two graders below need no
  # judge, and test-run.py pins them against both shapes. The marker stops at
  # the number, so a recommendation inside the question's own line is on it.
  # Bold marks may come before the number: "**1. ...?**" (#105).
  - type: regex
    name: asks-a-recommended-question
    target: trace
    pattern: '(?ims)(?:"question": "|^[ \t]*(?:\*\*)?\d+[.)][ \t](?=[^\n]*\?)).*?ecommend'
    match: contains
    weight: 3

  # A question that reaches the next question, the next tool call, or the end
  # of the trace, with no "ecommend" in between has no recommendation on it.
  # A tool call is a line that starts with {"; stopping there keeps a
  # researcher's "eslint:recommended" off a question that has none (#104).
  # flow's own 'Reply "yes to all" to take every recommendation' line is a
  # stop too, or the last question would borrow its word.
  - type: regex
    name: no-question-lacks-a-recommendation
    target: trace
    pattern: '(?ms)(?:"question": "|^[ \t]*(?:\*\*)?\d+[.)][ \t](?=[^\n]*\?))(?:(?!ecommend)(?!"question": ")(?!^[ \t]*(?:\*\*)?\d+[.)][ \t](?=[^\n]*\?))(?!^\{")(?!^[ \t>*_-]*Reply(?![A-Za-z])).)*(?:"question": "|^[ \t]*(?:\*\*)?\d+[.)][ \t](?=[^\n]*\?)|^\{"|^[ \t>*_-]*Reply(?![A-Za-z])|\Z)'
    match: not_contains
    weight: 2

  - type: llm
    name: asks-in-rounds-with-recommendations
    focus: trace
    criteria: >
      Deep work asks in rounds of up to 4 questions, each round shown as a
      popup (AskUserQuestion) or, where there is no popup tool, as one
      numbered list. PASS only if BOTH hold: (a) the questions arrived in
      rounds, not one question per turn when several were open at once; and
      (b) each question carries a recommended answer, first among its options
      and labelled "(Recommended)" in a popup. FAIL if it asked nothing at
      all, if open questions were drip-fed one at a time, or if any question
      was posed without a recommendation attached. A later round is fine
      only when earlier answers opened it up.

expected_outcome: >
  Announces "Deep — ..." naming why, then asks a round of questions, in a popup
  or a numbered list, with a recommendation on each, and stops for the answers.
